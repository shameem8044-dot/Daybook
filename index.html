<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1e26">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Smart Daybook &amp; Khata</title>
<link rel="manifest" id="pwaManifest">
<style>
  :root {
    --bg: #1c1e26;
    --surface: #262934;
    --surface-2: #2f3340;
    --border: #383d4d;
    --text: #f8fafc;
    --text-muted: #9ca3af;
    --nav-bg: #171920;
    --bento-yellow: #fde047;
    --bento-lime: #a3e635;
    --bento-orange: #fb923c;
    --bento-purple: #c4b5fd;
    --bento-cyan: #7dd3fc;
    --bento-slate: #8b95a5;
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.16);
    --radius: 16px;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.28);
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100dvh;
    width: 100%;
    overflow: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.35;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* Top App Bar */
  .topbar {
    background: var(--nav-bg);
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .brand-icon {
    width: 30px;
    height: 30px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--bento-yellow), var(--bento-orange));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 15px;
    color: #111827;
    flex-shrink: 0;
  }

  .brand-title {
    font-weight: 800;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 34px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
  }

  .icon-btn:active {
    background: #3a3f4f;
  }

  /* Date & Tabs Bar */
  .date-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex-shrink: 0;
  }

  .date-controls {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 1;
    min-width: 0;
  }

  .nav-arrow {
    width: 34px;
    height: 34px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .date-picker-wrap {
    position: relative;
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    min-width: 112px;
    flex: 1;
    max-width: 145px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    gap: 6px;
    cursor: pointer;
  }

  .date-display-text {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .date-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: none;
  }

  .today-btn {
    height: 34px;
    padding: 0 11px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    color: var(--bento-cyan);
    cursor: pointer;
    flex-shrink: 0;
  }

  .today-btn.is-today {
    background: var(--bento-cyan);
    color: #111827;
    border-color: var(--bento-cyan);
  }

  .view-tabs {
    display: none;
    gap: 6px;
  }

  .vtab-btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
  }

  .vtab-btn.active {
    background: var(--bento-purple);
    color: #111827;
    border-color: var(--bento-purple);
  }

  /* Summary Bar (Vibrant Sunny Yellow Bento Card) */
  .summary-bar {
    padding: 8px 10px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }

  .total-pill {
    flex: 1;
    background: var(--bento-yellow);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow);
  }

  .total-label {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #111827;
    opacity: 0.82;
  }

  .total-val {
    font-size: 20px;
    font-weight: 900;
    color: #111827;
  }

  /* Main Area */
  .main-area {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .view-pane {
    display: none;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    padding: 4px 10px 10px;
    gap: 8px;
  }

  .view-pane.active {
    display: flex;
  }

  /* Add Payment Card */
  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }

  .form-row {
    display: flex;
    gap: 6px;
    min-width: 0;
    align-items: center;
  }

  .field {
    width: 100%;
    min-width: 0;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 11px;
    font-family: var(--font);
    font-size: 13px;
    background: var(--surface-2);
    color: var(--text);
  }

  .field::placeholder {
    color: var(--text-muted);
  }

  .field:focus {
    outline: none;
    border-color: var(--bento-purple);
    box-shadow: 0 0 0 2px rgba(196, 181, 253, 0.25);
  }

  .pay-boxes-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .pay-box-chip {
    min-width: 96px;
    flex: 1;
    max-width: 145px;
    height: 38px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0 10px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 800;
    color: var(--bento-cyan);
    background: var(--surface-2);
    text-align: right;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pay-box-chip.active-box {
    border-color: var(--bento-cyan);
    background: rgba(125, 211, 252, 0.12);
  }

  .pay-box-num {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-muted);
  }

  .btn {
    height: 38px;
    padding: 0 15px;
    border: none;
    border-radius: 10px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .btn-primary { background: var(--bento-purple); color: #111827; }
  .btn-green { background: var(--bento-lime); color: #111827; }
  .btn-dark { background: var(--bento-slate); color: #111827; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #111827; }

  /* Party List */
  .list-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .party-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .party-summary-row {
    padding: 11px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--surface);
  }

  .party-info {
    min-width: 0;
    flex: 1;
  }

  .party-name {
    font-weight: 800;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .party-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .party-right-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .quick-plus-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: var(--bento-orange);
    color: #111827;
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .quick-plus-btn:active {
    opacity: 0.85;
  }

  .pay-total-btn {
    background: var(--bento-lime);
    color: #111827;
    border: none;
    border-radius: 10px;
    height: 36px;
    padding: 0 11px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  .pay-total-btn:active {
    opacity: 0.88;
  }

  .pay-caret {
    font-size: 10px;
    opacity: 0.8;
  }

  /* Expanded Individual Entries */
  .entries-drawer {
    display: none;
    border-top: 1px solid var(--border);
    background: #1f222c;
    padding: 8px 10px;
    flex-direction: column;
    gap: 8px;
  }

  .party-card.expanded .entries-drawer {
    display: flex;
  }

  .entries-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 12px;
  }

  .entries-table th {
    text-align: left;
    padding: 7px 8px;
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .entries-table td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text);
  }

  .entries-table tr:last-child td {
    border-bottom: none;
  }

  .entry-amt {
    font-weight: 800;
    color: var(--bento-lime);
  }

  .khata-row-checked td {
    text-decoration: line-through;
    color: var(--text-muted);
    opacity: 0.55;
  }

  .khata-row-checked .rm-btn {
    text-decoration: none;
  }

  .khata-chk {
    width: 18px;
    height: 18px;
    accent-color: var(--bento-lime);
    cursor: pointer;
    vertical-align: middle;
  }

  .rm-btn {
    height: 26px;
    padding: 0 8px;
    border: 1px solid rgba(248, 113, 113, 0.45);
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Bottom Navigation (Android) */
  .bottom-nav {
    background: var(--nav-bg);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    flex-shrink: 0;
    height: 54px;
  }

  .bnav-btn {
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    position: relative;
  }

  .bnav-btn.active {
    color: var(--bento-purple);
  }

  .bnav-btn.active::before {
    content: "";
    position: absolute;
    top: 0;
    left: 25%;
    right: 25%;
    height: 3px;
    background: var(--bento-purple);
    border-radius: 0 0 3px 3px;
  }

  .bnav-ico {
    font-size: 15px;
    line-height: 1;
  }

  .empty-state {
    text-align: center;
    padding: 28px 14px;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  @media (min-width: 768px) {
    .bottom-nav { display: none; }
    .view-tabs { display: flex; }
  }

  /* Custom Smart Payment Keypad Sheet (Dark Slate + Bento Pastel Scheme) */
  .keypad-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #171920;
    color: #fff;
    z-index: 70;
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.55);
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .keypad-sheet.open {
    display: flex;
  }

  .keypad-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 2px 4px;
  }

  .keypad-party-label {
    font-weight: 800;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .keypad-sum-pill {
    background: var(--bento-yellow);
    color: #111827;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .keypad-close-btn {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 28px;
    padding: 0 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  .keypad-boxes-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .kp-box {
    min-width: 86px;
    height: 40px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .kp-box.active {
    border-color: var(--bento-cyan);
    background: rgba(125, 211, 252, 0.14);
    color: var(--bento-cyan);
  }

  .kp-box-idx {
    font-size: 10px;
    color: var(--text-muted);
  }

  .keypad-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
  }

  .kp-key {
    height: 48px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .kp-key:active {
    background: var(--surface-2);
  }

  .kp-key.kp-plus {
    background: var(--bento-orange);
    color: #111827;
    border: none;
    font-size: 15px;
    font-weight: 900;
  }

  .kp-key.kp-enter {
    background: var(--bento-lime);
    color: #111827;
    border: none;
    font-size: 15px;
    font-weight: 900;
  }

  .kp-key.kp-fn {
    background: var(--surface-2);
    color: var(--bento-purple);
    font-size: 15px;
    font-weight: 800;
  }

  /* Modal & Toast */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 80;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal-title {
    font-weight: 800;
    font-size: 16px;
    margin: 0;
    color: var(--text);
  }

  .modal-body {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .toast {
    position: fixed;
    top: 56px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: var(--bento-purple);
    color: #111827;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 90;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- Top App Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">₹</div>
      <div class="brand-title">Smart Daybook</div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="shareDayBtn" title="Copy Summary">Share</button>
      <button type="button" class="icon-btn" id="backupBtn" title="Backup & Export">Backup</button>
      <button type="button" class="icon-btn" id="fullscreenBtn" title="Toggle Full Screen">Full</button>
    </div>
  </header>

  <!-- Date & View Switcher -->
  <div class="date-bar">
    <div class="date-controls">
      <button type="button" class="nav-arrow" id="prevDayBtn" aria-label="Previous Day">&lt;</button>
      <div class="date-picker-wrap" id="datePickerWrap">
        <span class="date-display-text" id="dateDisplayText"></span>
        <span style="font-size:12px;color:var(--text-muted);">📅</span>
        <input type="date" class="date-input" id="datePicker" aria-label="Select Date">
      </div>
      <button type="button" class="nav-arrow" id="nextDayBtn" aria-label="Next Day">&gt;</button>
      <button type="button" class="today-btn" id="todayBtn">Today</button>
    </div>
    <div class="view-tabs">
      <button type="button" class="vtab-btn active" data-view="daybook">Daybook</button>
      <button type="button" class="vtab-btn" data-view="khata">Khata Book</button>
    </div>
  </div>

  <!-- Total Bar -->
  <section class="summary-bar" aria-label="Total Summary">
    <div class="total-pill">
      <span class="total-label" id="summaryLabel">Today's Total Payment</span>
      <span class="total-val" id="summaryTotal">₹0</span>
    </div>
  </section>

  <!-- Main Content -->
  <main class="main-area">
    <!-- DAYBOOK VIEW -->
    <section class="view-pane active" id="daybookView">
      <form class="entry-card" id="entryForm" autocomplete="off">
        <div class="form-row">
          <input type="text" class="field" id="partyInput" list="partyDatalist" placeholder="Party name..." required>
          <input type="text" class="field" id="noteInput" placeholder="Note (optional)" style="max-width:130px;">
        </div>
        <div class="pay-boxes-row" id="topPayBoxes"></div>
      </form>
      <div class="list-scroll" id="daybookList"></div>
    </section>

    <!-- KHATA VIEW -->
    <section class="view-pane" id="khataView">
      <div class="form-row" style="flex-shrink:0;">
        <input type="search" class="field" id="khataSearchInput" placeholder="Search party name in Khata...">
      </div>
      <div class="list-scroll" id="khataList"></div>
    </section>
  </main>

  <!-- Android Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Primary Navigation">
    <button type="button" class="bnav-btn active" data-view="daybook">
      <span class="bnav-ico">₹</span>
      <span>Daybook</span>
    </button>
    <button type="button" class="bnav-btn" data-view="khata">
      <span class="bnav-ico">📒</span>
      <span>Khata</span>
    </button>
  </nav>
</div>

<!-- Custom Payment Keypad with + (New Box) and Enter (Save) -->
<section class="keypad-sheet" id="keypadSheet" aria-label="Payment Keypad">
  <div class="keypad-head">
    <div class="keypad-party-label" id="kpPartyLabel">Party</div>
    <div class="keypad-sum-pill" id="kpSumPill">Sum: ₹0</div>
    <button type="button" class="keypad-close-btn" id="kpCloseBtn">Done</button>
  </div>
  <div class="keypad-boxes-strip" id="kpBoxesStrip"></div>
  <div class="keypad-grid" id="keypadGrid">
    <button type="button" class="kp-key" data-key="7">7</button>
    <button type="button" class="kp-key" data-key="8">8</button>
    <button type="button" class="kp-key" data-key="9">9</button>
    <button type="button" class="kp-key kp-fn" data-key="BACK">⌫</button>

    <button type="button" class="kp-key" data-key="4">4</button>
    <button type="button" class="kp-key" data-key="5">5</button>
    <button type="button" class="kp-key" data-key="6">6</button>
    <button type="button" class="kp-key kp-plus" data-key="NEW_BOX">+ Box</button>

    <button type="button" class="kp-key" data-key="1">1</button>
    <button type="button" class="kp-key" data-key="2">2</button>
    <button type="button" class="kp-key" data-key="3">3</button>
    <button type="button" class="kp-key kp-fn" data-key="CLEAR">C</button>

    <button type="button" class="kp-key" data-key="00">00</button>
    <button type="button" class="kp-key" data-key="0">0</button>
    <button type="button" class="kp-key" data-key=".">.</button>
    <button type="button" class="kp-key kp-enter" data-key="ENTER">Enter</button>
  </div>
</section>

<datalist id="partyDatalist"></datalist>

<!-- Backup / Export Modal -->
<div class="modal-backdrop" id="backupModal">
  <div class="modal-box">
    <h3 class="modal-title">Backup &amp; Export Data</h3>
    <div class="modal-body">
      <div>Export all Daybook &amp; Khata records as JSON (for restore) or CSV (for Excel/Sheets).</div>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button type="button" class="btn btn-dark" id="exportJsonBtn">Download JSON</button>
        <button type="button" class="btn btn-green" id="exportCsvBtn">Download CSV</button>
      </div>
      <hr style="border:none;border-top:1px solid var(--border);width:100%;margin:4px 0;">
      <div><strong>Restore JSON Backup</strong></div>
      <input type="file" id="importJsonInput" accept=".json,application/json" style="font-size:12px;">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="closeBackupModalBtn">Close</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-backdrop" id="confirmModal">
  <div class="modal-box">
    <h3 class="modal-title" id="confirmTitle">Confirm</h3>
    <div class="modal-body" id="confirmMessage">Are you sure?</div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmOkBtn">Remove</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  try {
    var manifestObj = {
      name: "Smart Daybook & Khata",
      short_name: "Daybook",
      display: "fullscreen",
      orientation: "any",
      background_color: "#1c1e26",
      theme_color: "#1c1e26",
      start_url: "."
    };
    var mUrl = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj));
    document.getElementById("pwaManifest").setAttribute("href", mUrl);
  } catch (e) {}

  var STORAGE_KEY = "smart_daybook_simple_v3";
  var LEGACY_KEY = "smart_daybook_khata_v2";

  function localTodayStr() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function shiftDate(dateStr, deltaDays) {
    var parts = dateStr.split("-");
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    d.setDate(d.getDate() + deltaDays);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function formatDisplayDate(dateStr) {
    if (!dateStr || dateStr.indexOf("-") === -1) return dateStr || "";
    var p = dateStr.split("-");
    if (p.length !== 3) return dateStr;
    return p[2] + "-" + p[1] + "-" + p[0];
  }

  function formatINR(num) {
    var n = Number(num) || 0;
    return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  var state = {
    currentDate: localTodayStr(),
    activeView: "daybook",
    expandedDaybook: {},
    expandedKhata: {},
    days: {},
    // Keypad state
    kpOpen: false,
    kpTargetParty: null, // null = top form partyInput, string = existing party name
    kpBoxes: [""],
    kpActiveIdx: 0
  };

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && parsed.days) {
          state.days = parsed.days;
          return;
        }
      }
      var legacyRaw = localStorage.getItem(LEGACY_KEY);
      if (legacyRaw) {
        var legacy = JSON.parse(legacyRaw);
        if (legacy && legacy.days) {
          Object.keys(legacy.days).forEach(function (dt) {
            var d = legacy.days[dt];
            var list = [];
            (d.cash || []).forEach(function (c) {
              list.push({ id: c.id || uid(), party: c.party, amount: Number(c.amount) || 0, note: c.note || "" });
            });
            (d.upi || []).forEach(function (p) {
              (p.boxes || []).forEach(function (b) {
                var amt = Number(b.amount) || 0;
                if (amt > 0 || b.note) {
                  list.push({ id: b.id || uid(), party: p.party, amount: amt, note: b.note || "" });
                }
              });
            });
            if (list.length) state.days[dt] = list;
          });
          saveState();
        }
      }
    } catch (e) {}
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ days: state.days }));
    } catch (e) {}
  }

  function ensureDay(dateStr) {
    if (!Array.isArray(state.days[dateStr])) {
      state.days[dateStr] = [];
    }
    return state.days[dateStr];
  }

  var datePicker = document.getElementById("datePicker");
  var dateDisplayText = document.getElementById("dateDisplayText");
  var todayBtn = document.getElementById("todayBtn");
  var summaryLabel = document.getElementById("summaryLabel");
  var summaryTotal = document.getElementById("summaryTotal");
  var daybookList = document.getElementById("daybookList");
  var khataList = document.getElementById("khataList");
  var daybookView = document.getElementById("daybookView");
  var khataView = document.getElementById("khataView");
  var partyDatalist = document.getElementById("partyDatalist");
  var khataSearchInput = document.getElementById("khataSearchInput");
  var partyInput = document.getElementById("partyInput");
  var noteInput = document.getElementById("noteInput");
  var topPayBoxes = document.getElementById("topPayBoxes");

  var keypadSheet = document.getElementById("keypadSheet");
  var kpPartyLabel = document.getElementById("kpPartyLabel");
  var kpSumPill = document.getElementById("kpSumPill");
  var kpBoxesStrip = document.getElementById("kpBoxesStrip");

  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  var confirmModal = document.getElementById("confirmModal");
  var confirmTitle = document.getElementById("confirmTitle");
  var confirmMessage = document.getElementById("confirmMessage");
  var confirmCallback = null;

  function openConfirm(title, msg, onOk) {
    confirmTitle.textContent = title;
    confirmMessage.textContent = msg;
    confirmCallback = onOk;
    confirmModal.classList.add("open");
  }

  document.getElementById("confirmCancelBtn").addEventListener("click", function () {
    confirmModal.classList.remove("open");
    confirmCallback = null;
  });

  document.getElementById("confirmOkBtn").addEventListener("click", function () {
    confirmModal.classList.remove("open");
    if (typeof confirmCallback === "function") {
      confirmCallback();
    }
    confirmCallback = null;
  });

  function updatePartyDatalist() {
    var names = {};
    Object.keys(state.days).forEach(function (dt) {
      (state.days[dt] || []).forEach(function (entry) {
        if (entry.party && entry.party.trim()) {
          names[entry.party.trim()] = true;
        }
      });
    });
    partyDatalist.innerHTML = "";
    Object.keys(names).sort().forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      partyDatalist.appendChild(opt);
    });
  }

  // Keypad Logic
  function getKpSum() {
    var sum = 0;
    state.kpBoxes.forEach(function (val) {
      sum += parseFloat(val) || 0;
    });
    return sum;
  }

  function renderTopPayBoxes() {
    topPayBoxes.innerHTML = "";
    var boxes = state.kpTargetParty === null ? state.kpBoxes : [""];
    boxes.forEach(function (val, idx) {
      var boxBtn = document.createElement("button");
      boxBtn.type = "button";
      boxBtn.className = "pay-box-chip" + (state.kpOpen && state.kpTargetParty === null && state.kpActiveIdx === idx ? " active-box" : "");
      boxBtn.innerHTML = '<span class="pay-box-num">#' + (idx + 1) + '</span><span>' + (val ? "₹" + val : "₹ Payment") + '</span>';
      boxBtn.addEventListener("click", function () {
        if (state.kpTargetParty !== null) {
          state.kpTargetParty = null;
          state.kpBoxes = [""];
        }
        state.kpActiveIdx = idx;
        openKeypad(null, idx);
      });
      topPayBoxes.appendChild(boxBtn);
    });

    var saveTopBtn = document.createElement("button");
    saveTopBtn.type = "submit";
    saveTopBtn.className = "btn btn-green";
    saveTopBtn.textContent = "Save";
    topPayBoxes.appendChild(saveTopBtn);
  }

  function renderKeypad() {
    keypadSheet.classList.toggle("open", state.kpOpen);
    if (!state.kpOpen) return;

    var label = state.kpTargetParty ? state.kpTargetParty : (partyInput.value.trim() || "New Payment");
    kpPartyLabel.textContent = label;
    kpSumPill.textContent = "Sum: " + formatINR(getKpSum());

    kpBoxesStrip.innerHTML = "";
    state.kpBoxes.forEach(function (val, idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "kp-box" + (idx === state.kpActiveIdx ? " active" : "");
      b.innerHTML = '<span class="kp-box-idx">#' + (idx + 1) + '</span><span>' + (val ? "₹" + val : "0") + '</span>';
      b.addEventListener("click", function () {
        state.kpActiveIdx = idx;
        renderKeypad();
        if (state.kpTargetParty === null) renderTopPayBoxes();
      });
      kpBoxesStrip.appendChild(b);
    });
  }

  function openKeypad(targetParty, activeIdx) {
    if (targetParty !== state.kpTargetParty) {
      state.kpTargetParty = targetParty;
      state.kpBoxes = [""];
      state.kpActiveIdx = 0;
    } else if (typeof activeIdx === "number") {
      state.kpActiveIdx = activeIdx;
    }
    state.kpOpen = true;
    partyInput.blur();
    noteInput.blur();
    renderKeypad();
    renderTopPayBoxes();
  }

  function closeKeypad() {
    state.kpOpen = false;
    renderKeypad();
    renderTopPayBoxes();
  }

  function saveKeypadEntries() {
    var party = state.kpTargetParty ? state.kpTargetParty : partyInput.value.trim();
    if (!party) {
      showToast("Enter Party Name first");
      closeKeypad();
      partyInput.focus();
      return;
    }
    var validAmounts = [];
    state.kpBoxes.forEach(function (val) {
      var n = parseFloat(val);
      if (!isNaN(n) && n > 0) validAmounts.push(n);
    });
    if (!validAmounts.length) {
      showToast("Enter payment amount");
      return;
    }
    var list = ensureDay(state.currentDate);
    var note = state.kpTargetParty === null ? noteInput.value.trim() : "";
    validAmounts.forEach(function (amt) {
      list.unshift({
        id: uid(),
        party: party,
        amount: amt,
        note: note
      });
    });
    saveState();
    if (state.kpTargetParty === null) {
      partyInput.value = "";
      noteInput.value = "";
    }
    state.kpBoxes = [""];
    state.kpActiveIdx = 0;
    state.kpTargetParty = null;
    state.kpOpen = false;
    renderAll();
    showToast("Saved " + validAmounts.length + " payment(s) for " + party);
  }

  function handleKeypadAction(key) {
    var cur = state.kpBoxes[state.kpActiveIdx] || "";
    if (key === "BACK") {
      state.kpBoxes[state.kpActiveIdx] = cur.slice(0, -1);
    } else if (key === "CLEAR") {
      state.kpBoxes[state.kpActiveIdx] = "";
    } else if (key === "NEW_BOX") {
      state.kpBoxes.push("");
      state.kpActiveIdx = state.kpBoxes.length - 1;
    } else if (key === "ENTER") {
      saveKeypadEntries();
      return;
    } else if (key === ".") {
      if (cur.indexOf(".") === -1) {
        state.kpBoxes[state.kpActiveIdx] = (cur || "0") + ".";
      }
    } else {
      if (cur === "0" && key !== ".") cur = "";
      if (cur.length < 10) {
        state.kpBoxes[state.kpActiveIdx] = cur + key;
      }
    }
    renderKeypad();
    if (state.kpTargetParty === null) renderTopPayBoxes();
  }

  document.getElementById("keypadGrid").addEventListener("click", function (ev) {
    var btn = ev.target.closest("[data-key]");
    if (!btn) return;
    handleKeypadAction(btn.getAttribute("data-key"));
  });

  document.getElementById("kpCloseBtn").addEventListener("click", closeKeypad);

  // Physical keyboard support when keypad is open
  document.addEventListener("keydown", function (ev) {
    if (!state.kpOpen) return;
    if (document.activeElement === partyInput || document.activeElement === noteInput || document.activeElement === khataSearchInput) {
      return;
    }
    if (ev.key >= "0" && ev.key <= "9") {
      ev.preventDefault();
      handleKeypadAction(ev.key);
    } else if (ev.key === ".") {
      ev.preventDefault();
      handleKeypadAction(".");
    } else if (ev.key === "Backspace") {
      ev.preventDefault();
      handleKeypadAction("BACK");
    } else if (ev.key === "+") {
      ev.preventDefault();
      handleKeypadAction("NEW_BOX");
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      handleKeypadAction("ENTER");
    } else if (ev.key === "Escape") {
      ev.preventDefault();
      closeKeypad();
    }
  });

  function renderDaybook() {
    var entries = ensureDay(state.currentDate);
    var dayTotal = 0;
    var partyGroups = {};
    var order = [];

    entries.forEach(function (item) {
      var name = (item.party || "").trim();
      if (!name) return;
      var amt = Number(item.amount) || 0;
      dayTotal += amt;
      if (!partyGroups[name]) {
        partyGroups[name] = { total: 0, items: [] };
        order.push(name);
      }
      partyGroups[name].total += amt;
      partyGroups[name].items.push(item);
    });

    if (state.activeView === "daybook") {
      summaryLabel.textContent = state.currentDate === localTodayStr()
        ? "Today's Total Payment"
        : "Total Payment (" + formatDisplayDate(state.currentDate) + ")";
      summaryTotal.textContent = formatINR(dayTotal);
    }

    daybookList.innerHTML = "";
    if (!order.length) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No payments for " + formatDisplayDate(state.currentDate) + ". Enter Party Name & tap Payment above.";
      daybookList.appendChild(empty);
      return;
    }

    order.forEach(function (name) {
      var group = partyGroups[name];
      var isExpanded = !!state.expandedDaybook[name];

      var card = document.createElement("div");
      card.className = "party-card" + (isExpanded ? " expanded" : "");

      var row = document.createElement("div");
      row.className = "party-summary-row";

      var info = document.createElement("div");
      info.className = "party-info";
      var nameEl = document.createElement("div");
      nameEl.className = "party-name";
      nameEl.textContent = name;
      var subEl = document.createElement("div");
      subEl.className = "party-sub";
      subEl.textContent = group.items.length + " entr" + (group.items.length === 1 ? "y" : "ies") + " · + to add or tap total";
      info.appendChild(nameEl);
      info.appendChild(subEl);

      var actions = document.createElement("div");
      actions.className = "party-right-actions";

      var plusBtn = document.createElement("button");
      plusBtn.type = "button";
      plusBtn.className = "quick-plus-btn";
      plusBtn.textContent = "+";
      plusBtn.title = "Add payment to " + name;
      plusBtn.addEventListener("click", function () {
        openKeypad(name, 0);
      });

      var payBtn = document.createElement("button");
      payBtn.type = "button";
      payBtn.className = "pay-total-btn";
      payBtn.innerHTML = '<span>' + formatINR(group.total) + '</span><span class="pay-caret">' + (isExpanded ? "▲" : "▼") + '</span>';
      payBtn.title = "Click to view individual payment entries";
      payBtn.addEventListener("click", function () {
        state.expandedDaybook[name] = !state.expandedDaybook[name];
        renderDaybook();
      });

      actions.appendChild(plusBtn);
      actions.appendChild(payBtn);

      row.appendChild(info);
      row.appendChild(actions);

      var drawer = document.createElement("div");
      drawer.className = "entries-drawer";

      var table = document.createElement("table");
      table.className = "entries-table";
      table.innerHTML = '<thead><tr><th style="width:28px;">#</th><th>Amount</th><th>Note</th><th style="text-align:right;">Action</th></tr></thead>';

      var tbody = document.createElement("tbody");
      group.items.forEach(function (entry, idx) {
        var tr = document.createElement("tr");

        var tdIdx = document.createElement("td");
        tdIdx.textContent = idx + 1;

        var tdAmt = document.createElement("td");
        tdAmt.className = "entry-amt";
        tdAmt.textContent = formatINR(entry.amount);

        var tdNote = document.createElement("td");
        tdNote.textContent = entry.note || "—";

        var tdAct = document.createElement("td");
        tdAct.style.textAlign = "right";
        var rmBtn = document.createElement("button");
        rmBtn.type = "button";
        rmBtn.className = "rm-btn";
        rmBtn.textContent = "Remove";
        rmBtn.addEventListener("click", function () {
          state.days[state.currentDate] = entries.filter(function (x) { return x.id !== entry.id; });
          saveState();
          renderAll();
          showToast("Entry removed");
        });
        tdAct.appendChild(rmBtn);

        tr.appendChild(tdIdx);
        tr.appendChild(tdAmt);
        tr.appendChild(tdNote);
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      drawer.appendChild(table);
      card.appendChild(row);
      card.appendChild(drawer);
      daybookList.appendChild(card);
    });
  }

  function renderKhata() {
    var query = khataSearchInput.value.trim().toLowerCase();
    var partyMap = {};
    var khataGrandTotal = 0;

    Object.keys(state.days).sort().reverse().forEach(function (dt) {
      (state.days[dt] || []).forEach(function (item) {
        var name = (item.party || "").trim();
        if (!name) return;
        var amt = Number(item.amount) || 0;
        if (!partyMap[name]) partyMap[name] = { total: 0, entries: [] };
        partyMap[name].total += amt;
        partyMap[name].entries.push({
          date: dt,
          id: item.id,
          amount: amt,
          note: item.note || "",
          checked: !!item.checked,
          ref: item
        });
      });
    });

    var partyNames = Object.keys(partyMap).filter(function (n) {
      return !query || n.toLowerCase().indexOf(query) !== -1;
    }).sort();

    partyNames.forEach(function (n) {
      khataGrandTotal += partyMap[n].total;
    });

    if (state.activeView === "khata") {
      summaryLabel.textContent = "Khata Total Payment";
      summaryTotal.textContent = formatINR(khataGrandTotal);
    }

    khataList.innerHTML = "";
    if (!partyNames.length) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No Khata records found.";
      khataList.appendChild(empty);
      return;
    }

    partyNames.forEach(function (name) {
      var info = partyMap[name];
      var isExpanded = !!state.expandedKhata[name];

      var card = document.createElement("div");
      card.className = "party-card" + (isExpanded ? " expanded" : "");

      var row = document.createElement("div");
      row.className = "party-summary-row";

      var pInfo = document.createElement("div");
      pInfo.className = "party-info";
      var pName = document.createElement("div");
      pName.className = "party-name";
      pName.textContent = name;
      var pSub = document.createElement("div");
      pSub.className = "party-sub";
      pSub.textContent = info.entries.length + " payment" + (info.entries.length === 1 ? "" : "s") + " · + to add or tap total";
      pInfo.appendChild(pName);
      pInfo.appendChild(pSub);

      var actions = document.createElement("div");
      actions.className = "party-right-actions";

      var plusBtn = document.createElement("button");
      plusBtn.type = "button";
      plusBtn.className = "quick-plus-btn";
      plusBtn.textContent = "+";
      plusBtn.title = "Add payment to " + name;
      plusBtn.addEventListener("click", function () {
        openKeypad(name, 0);
      });

      var payBtn = document.createElement("button");
      payBtn.type = "button";
      payBtn.className = "pay-total-btn";
      payBtn.innerHTML = '<span>' + formatINR(info.total) + '</span><span class="pay-caret">' + (isExpanded ? "▲" : "▼") + '</span>';
      payBtn.title = "Click to view all payment entries";
      payBtn.addEventListener("click", function () {
        state.expandedKhata[name] = !state.expandedKhata[name];
        renderKhata();
      });

      actions.appendChild(plusBtn);
      actions.appendChild(payBtn);

      row.appendChild(pInfo);
      row.appendChild(actions);

      var drawer = document.createElement("div");
      drawer.className = "entries-drawer";

      var sortedEntries = info.entries.slice().sort(function (a, b) {
        return (a.checked ? 1 : 0) - (b.checked ? 1 : 0);
      });

      var table = document.createElement("table");
      table.className = "entries-table";
      table.innerHTML = '<thead><tr><th style="width:28px;text-align:center;">✓</th><th>Date</th><th>Amount</th><th>Note</th><th style="text-align:right;">Action</th></tr></thead>';

      var tbody = document.createElement("tbody");
      sortedEntries.forEach(function (e) {
        var tr = document.createElement("tr");
        if (e.checked) tr.className = "khata-row-checked";

        var tdChk = document.createElement("td");
        tdChk.style.textAlign = "center";
        var chk = document.createElement("input");
        chk.type = "checkbox";
        chk.className = "khata-chk";
        chk.checked = !!e.checked;
        chk.title = "Check payment";
        chk.addEventListener("change", function () {
          e.ref.checked = chk.checked;
          saveState();
          renderKhata();
        });
        tdChk.appendChild(chk);

        var tdDate = document.createElement("td");
        tdDate.textContent = formatDisplayDate(e.date);

        var tdAmt = document.createElement("td");
        tdAmt.className = "entry-amt";
        tdAmt.textContent = formatINR(e.amount);

        var tdNote = document.createElement("td");
        tdNote.textContent = e.note || "—";

        var tdAct = document.createElement("td");
        tdAct.style.textAlign = "right";
        var rmBtn = document.createElement("button");
        rmBtn.type = "button";
        rmBtn.className = "rm-btn";
        rmBtn.textContent = "Remove";
        rmBtn.addEventListener("click", function () {
          openConfirm("Remove Payment", "Remove " + formatINR(e.amount) + " for " + name + " (" + e.date + ")?", function () {
            state.days[e.date] = (state.days[e.date] || []).filter(function (x) { return x.id !== e.id; });
            saveState();
            renderAll();
            showToast("Hisab cleared & removed");
          });
        });
        tdAct.appendChild(rmBtn);

        tr.appendChild(tdChk);
        tr.appendChild(tdDate);
        tr.appendChild(tdAmt);
        tr.appendChild(tdNote);
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      drawer.appendChild(table);
      card.appendChild(row);
      card.appendChild(drawer);
      khataList.appendChild(card);
    });
  }

  function applyViewState() {
    var isDaybook = state.activeView === "daybook";
    daybookView.classList.toggle("active", isDaybook);
    khataView.classList.toggle("active", !isDaybook);

    document.querySelectorAll("[data-view]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-view") === state.activeView);
    });
  }

  function renderAll() {
    datePicker.value = state.currentDate;
    dateDisplayText.textContent = formatDisplayDate(state.currentDate);
    todayBtn.classList.toggle("is-today", state.currentDate === localTodayStr());
    applyViewState();
    updatePartyDatalist();
    renderTopPayBoxes();
    renderKeypad();
    renderDaybook();
    renderKhata();
  }

  document.getElementById("prevDayBtn").addEventListener("click", function () {
    state.currentDate = shiftDate(state.currentDate, -1);
    renderAll();
  });

  document.getElementById("nextDayBtn").addEventListener("click", function () {
    state.currentDate = shiftDate(state.currentDate, 1);
    renderAll();
  });

  todayBtn.addEventListener("click", function () {
    state.currentDate = localTodayStr();
    renderAll();
  });

  datePicker.addEventListener("change", function () {
    if (datePicker.value) {
      state.currentDate = datePicker.value;
      renderAll();
    }
  });

  document.querySelectorAll("[data-view]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.activeView = btn.getAttribute("data-view");
      renderAll();
    });
  });

  document.getElementById("entryForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (state.kpTargetParty !== null) {
      state.kpTargetParty = null;
      state.kpBoxes = [""];
    }
    saveKeypadEntries();
  });

  khataSearchInput.addEventListener("input", renderKhata);

  document.getElementById("fullscreenBtn").addEventListener("click", function () {
    try {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    } catch (e) {
      showToast("Fullscreen not supported here");
    }
  });

  document.getElementById("shareDayBtn").addEventListener("click", function () {
    var entries = ensureDay(state.currentDate);
    var totalsByParty = {};
    var dayTotal = 0;
    entries.forEach(function (e) {
      var amt = Number(e.amount) || 0;
      dayTotal += amt;
      totalsByParty[e.party] = (totalsByParty[e.party] || 0) + amt;
    });
    var lines = [
      "Smart Daybook (" + formatDisplayDate(state.currentDate) + ")",
      "Total Payment: " + formatINR(dayTotal)
    ];
    Object.keys(totalsByParty).forEach(function (name) {
      lines.push("• " + name + ": " + formatINR(totalsByParty[name]));
    });
    var text = lines.join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Summary copied!");
      }).catch(function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("Summary copied!");
    } catch (e) {
      showToast("Copy failed");
    }
    document.body.removeChild(ta);
  }

  var backupModal = document.getElementById("backupModal");
  document.getElementById("backupBtn").addEventListener("click", function () {
    backupModal.classList.add("open");
  });
  document.getElementById("closeBackupModalBtn").addEventListener("click", function () {
    backupModal.classList.remove("open");
  });

  function downloadFile(filename, content, mime) {
    var blob = new Blob([content], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("exportJsonBtn").addEventListener("click", function () {
    downloadFile("daybook-backup-" + localTodayStr() + ".json", JSON.stringify(state.days, null, 2), "application/json");
    showToast("JSON backup downloaded");
  });

  document.getElementById("exportCsvBtn").addEventListener("click", function () {
    var rows = [["Date", "Party", "Amount", "Note"]];
    Object.keys(state.days).sort().forEach(function (dt) {
      (state.days[dt] || []).forEach(function (e) {
        rows.push([
          formatDisplayDate(dt),
          '"' + String(e.party || "").replace(/"/g, '""') + '"',
          Number(e.amount) || 0,
          '"' + String(e.note || "").replace(/"/g, '""') + '"'
        ]);
      });
    });
    var csv = rows.map(function (r) { return r.join(","); }).join("\n");
    downloadFile("daybook-export-" + localTodayStr() + ".csv", csv, "text/csv");
    showToast("CSV downloaded");
  });

  document.getElementById("importJsonInput").addEventListener("change", function (ev) {
    var file = ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var parsed = JSON.parse(e.target.result);
        if (parsed && typeof parsed === "object") {
          state.days = parsed;
          saveState();
          renderAll();
          backupModal.classList.remove("open");
          showToast("Backup restored!");
        }
      } catch (err) {
        showToast("Invalid JSON file");
      }
    };
    reader.readAsText(file);
  });

  loadState();
  renderAll();
})();
</script>
</body>
